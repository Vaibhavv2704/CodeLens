services:
  - type: web
    name: agentic-github-code-reviewer
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_SANDBOX
        value: "false"
